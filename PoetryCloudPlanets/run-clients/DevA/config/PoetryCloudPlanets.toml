
#World and planet generation / 世界与星球生成
[world]
	#Random planet count; controls how many random planet templates are injected into a new save by default. / 随机星球数量，决定默认向新存档注入多少个随机星球模板。
	#Range: 0 ~ 1000000
	randomPlanetCount = 5

#Random material pool / 随机材料池
[materials]
	#Import the built-in natural material archive automatically, including stone, sediment, ores, ice and snow, crystals, Nether or End strata, water, lava, and similar blocks. / 是否自动导入内置自然材料档案，包括岩石、沉积物、矿石、冰雪、晶体、下界或末地地层、水、岩浆等。
	autoImportDefaultMaterials = true
	#Random material count range per random planet, formatted as [min, max]. / 每个随机星球抽取的材料种类范围，格式为 [min, max]。
	randomMaterialCountRange = [4, 7]
	#Distance shell scale range k for random planets, formatted as [min, max]. The final random distance range is the special-planet distance range multiplied by this scale. / 随机星球球壳比例 k 的范围，格式为 [min, max]。最终随机距离范围会按特殊星球距离范围乘以这个比例缩放。
	randomPlanetDistanceScaleRange = [0.5, 2.0]
	#Whitelist of block IDs that are forced into the random material pool. If a block is missing from poetrycloud_extra_block_materials.json, add it there first; otherwise the mod will generate a fallback profile from the block ID. / 手动加入随机材料池的方块 ID 白名单；如果某个方块资料不在 poetrycloud_extra_block_materials.json 里，可以先补到那里，不补则会按 block id 自动生成一份资料。
	materialWhitelist = ["minecraft:stone"]
	#Blacklist of block IDs removed from the random material pool. / 从随机材料池中剔除的方块 ID 黑名单。
	materialBlacklist = []

#Observation output / 观星结果
[observation]
	#Observation variable keys that are currently generated and displayed. / 当前参与生成和展示的观星变量名。
	observationVariables = ["brightness", "spectrum", "composition", "gravity", "atmosphere", "radiation", "orbitalAnomaly", "sector"]
	#Apparent magnitude range, formatted as [min, max]. Smaller values are brighter. / 视星等范围，格式为 [min, max]。数值越小表示越亮。
	brightnessRange = [-2.4, 12.8]
	#Spectrum RGB range, formatted as [minHex, maxHex], for example ["000000", "ffffff"]. / 光谱 RGB 范围，格式为 [minHex, maxHex]，例如 ["000000", "ffffff"]。
	spectrumColorRange = ["000000", "ffffff"]
	#Gravity range in g, formatted as [min, max]. / 重力系数范围，格式为 [min, max]，单位 g。
	gravityRange = [0.08, 4.25]
	#Radiation range in μSv/h, formatted as [min, max]. / 辐射范围，格式为 [min, max]，单位 μSv/h。
	radiationRange = [0.0, 180.0]
	#Candidate atmosphere descriptions. / 大气描述候选项。
	atmosphereOptions = ["真空", "极稀薄氮氧层", "稀薄氮氧层", "标准氮氧层", "高压二氧化碳层", "甲烷雾层", "尘埃悬浮层", "离子薄层"]
	#Candidate sector descriptions. / 星域描述候选项。
	sectorOptions = ["内环", "中环", "外环", "边缘带", "断裂层", "核心带"]

#Dimension generation profiles / 维度生成模板配置
[dimensionGeneration]

	#Random planet profile / 随机星球维度模板
	[dimensionGeneration.randomPlanet]
		#Reference dimension ID list used to borrow biome source and noise settings. Invalid entries are ignored; if the list becomes empty, the Overworld is used. If multiple valid dimensions remain, each planet stably picks one from the list. / 参考维度 ID 列表，用来借用生物群系源和噪声设置；非法项会被忽略，若最终为空则回退到主世界；若存在多个有效维度，则每个星球会稳定地从列表中选一个。
		referenceDimension = ["minecraft:overworld"]
		#Replace natural terrain blocks with the selected random material pool. / 是否用选中的随机材料池替换自然地形方块。
		replaceMaterials = true
		#Generate structures in this managed dimension. / 是否在这个托管维度中生成结构。
		generateStructures = false
		#Allow vanilla mob spawning in this managed dimension. / 是否允许这个托管维度刷出原版生物。
		spawnMobs = false

		#Shared decoration stages / 通用装饰生成阶段
		[dimensionGeneration.randomPlanet.generateStages]
			#Raw generation stage / 原始地形附加工序。
			rawGeneration = false
			#Lakes stage / 湖泊与大型液体坑阶段。
			lakes = false
			#Local modifications stage / 局部地形修饰阶段。
			localModifications = false
			#Underground structures stage / 地下类生成内容阶段。
			undergroundStructures = false
			#Surface structures stage / 地表类生成内容阶段。
			surfaceStructures = false
			#Strongholds stage / 要塞阶段。
			strongholds = false
			#Underground ores stage / 地下矿物与晶洞阶段。
			undergroundOres = false
			#Underground decoration stage / 地下装饰阶段。
			undergroundDecoration = false
			#Fluid springs stage / 泉眼与流体喷口阶段。
			fluidSprings = false
			#Vegetal decoration stage / 植被阶段。
			vegetalDecoration = false
			#Top layer modification stage / 顶层修改阶段。
			topLayerModification = false

	#Blank special planet profile / 空白特殊星球维度模板
	[dimensionGeneration.specialPlanet]
		#Reference dimension ID list used to borrow biome source and noise settings. Invalid entries are ignored; if the list becomes empty, the Overworld is used. If multiple valid dimensions remain, each planet stably picks one from the list. / 参考维度 ID 列表，用来借用生物群系源和噪声设置；非法项会被忽略，若最终为空则回退到主世界；若存在多个有效维度，则每个星球会稳定地从列表中选一个。
		referenceDimension = ["minecraft:overworld"]
		#Replace natural terrain blocks with the selected random material pool. / 是否用选中的随机材料池替换自然地形方块。
		replaceMaterials = false
		#Generate structures in this managed dimension. / 是否在这个托管维度中生成结构。
		generateStructures = true
		#Allow vanilla mob spawning in this managed dimension. / 是否允许这个托管维度刷出原版生物。
		spawnMobs = true

		#Shared decoration stages / 通用装饰生成阶段
		[dimensionGeneration.specialPlanet.generateStages]
			#Raw generation stage / 原始地形附加工序。
			rawGeneration = true
			#Lakes stage / 湖泊与大型液体坑阶段。
			lakes = true
			#Local modifications stage / 局部地形修饰阶段。
			localModifications = true
			#Underground structures stage / 地下类生成内容阶段。
			undergroundStructures = true
			#Surface structures stage / 地表类生成内容阶段。
			surfaceStructures = true
			#Strongholds stage / 要塞阶段。
			strongholds = true
			#Underground ores stage / 地下矿物与晶洞阶段。
			undergroundOres = true
			#Underground decoration stage / 地下装饰阶段。
			undergroundDecoration = true
			#Fluid springs stage / 泉眼与流体喷口阶段。
			fluidSprings = true
			#Vegetal decoration stage / 植被阶段。
			vegetalDecoration = true
			#Top layer modification stage / 顶层修改阶段。
			topLayerModification = true

